<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em {
        color:blue; text-decoration: underline;

        }

        code {

            color: rgb(18, 16, 20); text-decoration: underline;
        }

        body > main > ol > li:nth-child(1) > code {
                        color: white;
                        background-color: black;

        }

    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Embutido</h1>
        <p>O estilo <em>em linha</em>
            é aplicado diretamente no 
            elemento via tributo
            <code>style</code>.
            
            <ol>
                <li><code>Hello world!</code></li>
                <li><code>2+2 = 4</code></li>
            </ol>
        </p>
    </main>
    
</body>
</html>
